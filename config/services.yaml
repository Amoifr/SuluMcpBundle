services:
    _defaults:
        autowire: true
        autoconfigure: true

    Sulu\McpServerBundle\Capabilities\Tool\PingTool: ~
    Sulu\McpServerBundle\Capabilities\Tool\GetContextTool: ~
    Sulu\McpServerBundle\Capabilities\Tool\ContentSearchTool:
        arguments:
            $engine: '@cmsig_seal.engine.default'

    # MCP Resources: discovery layer for AI clients
    Sulu\McpServerBundle\Capabilities\Resource\TemplatesResource:
        arguments:
            $formMetadataProvider: '@sulu_admin.form_metadata_provider'
    Sulu\McpServerBundle\Capabilities\Resource\BlocksResource:
        arguments:
            $formMetadataProvider: '@sulu_admin.form_metadata_provider'
    Sulu\McpServerBundle\Capabilities\Resource\WebspacesResource: ~
# OAuth well-known controller
    Sulu\McpServerBundle\Security\OAuth\WellKnownController:
        arguments:
            $serverUrl: '%sulu_mcp_server.server_url%'
        tags: ['controller.service_arguments']

    Sulu\McpServerBundle\Security\OAuth\DynamicClientRegistrationController:
        arguments:
            $serverUrl: '%sulu_mcp_server.server_url%'
        tags: ['controller.service_arguments']

    Sulu\McpServerBundle\Security\OAuth\SuluUserResolver: ~

    # OAuth authorization
    Sulu\McpServerBundle\Security\EventListener\OAuthAuthorizationListener: ~

    # Decorate Sulu's entry point for friendly OAuth login page
    Sulu\McpServerBundle\Security\McpAuthenticationEntryPoint:
        decorates: sulu_security.authentication_entry_point
        arguments:
            $inner: '@.inner'

    # MCP event listeners
    Sulu\McpServerBundle\Security\EventListener\McpAuthenticationListener:
        arguments:
            $serverUrl: '%sulu_mcp_server.server_url%'
            $mcpPath: '%sulu_mcp_server.mcp_path%'

    Sulu\McpServerBundle\Security\EventListener\McpExceptionListener:
        arguments:
            $mcpPath: '%sulu_mcp_server.mcp_path%'

    # Sets Sulu system context for MCP requests so the UserProvider can authenticate OAuth users
    Sulu\McpServerBundle\Security\EventListener\OAuthSystemStoreListener:
        arguments:
            $mcpPath: '%sulu_mcp_server.mcp_path%'
            $defaultSystem: 'Sulu'
        tags:
            - { name: kernel.event_listener, event: kernel.request, method: onKernelRequest, priority: 64 }

    # Commands
    Sulu\McpServerBundle\Command\CreateMcpClientCommand:
        arguments:
            $serverUrl: '%sulu_mcp_server.server_url%'

    # Page read tools
    Sulu\McpServerBundle\Capabilities\Tool\Page\PageGetTool: ~
    Sulu\McpServerBundle\Capabilities\Tool\Page\PageListTool: ~
    Sulu\McpServerBundle\Capabilities\Tool\Page\PageTreeTool: ~

    # Page write tools
    Sulu\McpServerBundle\Capabilities\Tool\Page\PageCreateTool: ~
    Sulu\McpServerBundle\Capabilities\Tool\Page\PageUpdateTool: ~
    Sulu\McpServerBundle\Capabilities\Tool\Page\PageDeleteTool: ~  # gated by dangerous_tools.delete

    # Block management tools
    Sulu\McpServerBundle\Capabilities\Tool\Block\BlockDataValidator:
        arguments:
            $formMetadataProvider: '@sulu_admin.form_metadata_provider'
    Sulu\McpServerBundle\Capabilities\Tool\Page\BlockListTool: ~
    Sulu\McpServerBundle\Capabilities\Tool\Page\BlockAddTool: ~
    Sulu\McpServerBundle\Capabilities\Tool\Page\BlockUpdateTool: ~
    Sulu\McpServerBundle\Capabilities\Tool\Page\BlockRemoveTool: ~  # gated by dangerous_tools.block_remove
    Sulu\McpServerBundle\Capabilities\Tool\Page\BlockReorderTool: ~

    Sulu\Page\Domain\Repository\NavigationRepositoryInterface:
        alias: sulu_page.navigation_repository

    Sulu\Bundle\PreviewBundle\Application\Manager\PreviewLinkManagerInterface:
        alias: sulu_preview.preview_link_manager

    # Publishing tools
    Sulu\McpServerBundle\Capabilities\Tool\Page\PagePublishTool: ~  # gated by dangerous_tools.publish
    Sulu\McpServerBundle\Capabilities\Tool\Page\PageUnpublishTool: ~  # gated by dangerous_tools.publish

    # Page SEO and excerpt tools
    Sulu\McpServerBundle\Capabilities\Tool\Page\PageSeoGetTool: ~
    Sulu\McpServerBundle\Capabilities\Tool\Page\PageSeoUpdateTool: ~
    Sulu\McpServerBundle\Capabilities\Tool\Page\PageExcerptGetTool: ~
    Sulu\McpServerBundle\Capabilities\Tool\Page\PageExcerptUpdateTool: ~

    # Phase 04: Article tools
    Sulu\McpServerBundle\Capabilities\Tool\Article\ArticleGetTool: ~
    Sulu\McpServerBundle\Capabilities\Tool\Article\ArticleListTool: ~
    Sulu\McpServerBundle\Capabilities\Tool\Article\ArticleCreateTool: ~
    Sulu\McpServerBundle\Capabilities\Tool\Article\ArticleUpdateTool: ~
    Sulu\McpServerBundle\Capabilities\Tool\Article\ArticleDeleteTool: ~  # gated by dangerous_tools.delete
    Sulu\McpServerBundle\Capabilities\Tool\Article\ArticlePublishTool: ~  # gated by dangerous_tools.publish
    Sulu\McpServerBundle\Capabilities\Tool\Article\ArticleUnpublishTool: ~  # gated by dangerous_tools.publish

    # Article SEO and excerpt tools
    Sulu\McpServerBundle\Capabilities\Tool\Article\ArticleSeoGetTool: ~
    Sulu\McpServerBundle\Capabilities\Tool\Article\ArticleSeoUpdateTool: ~
    Sulu\McpServerBundle\Capabilities\Tool\Article\ArticleExcerptGetTool: ~
    Sulu\McpServerBundle\Capabilities\Tool\Article\ArticleExcerptUpdateTool: ~

    # Phase 04: Article block tools
    Sulu\McpServerBundle\Capabilities\Tool\Article\ArticleBlockAddTool: ~
    Sulu\McpServerBundle\Capabilities\Tool\Article\ArticleBlockRemoveTool: ~  # gated by dangerous_tools.block_remove
    Sulu\McpServerBundle\Capabilities\Tool\Article\ArticleBlockReorderTool: ~

    # Phase 04: Taxonomy tools
    Sulu\McpServerBundle\Capabilities\Tool\Taxonomy\TagCreateTool: ~
    Sulu\McpServerBundle\Capabilities\Tool\Taxonomy\TagListTool: ~
    Sulu\McpServerBundle\Capabilities\Tool\Taxonomy\TagDeleteTool: ~  # gated by dangerous_tools.delete
    Sulu\McpServerBundle\Capabilities\Tool\Taxonomy\CategoryCreateTool: ~
    Sulu\McpServerBundle\Capabilities\Tool\Taxonomy\CategoryListTool: ~
    Sulu\McpServerBundle\Capabilities\Tool\Taxonomy\CategoryDeleteTool: ~  # gated by dangerous_tools.delete

    # Phase 04: Media tools
    Sulu\McpServerBundle\Capabilities\Tool\Media\MediaListTool: ~
    Sulu\McpServerBundle\Capabilities\Tool\Media\MediaGetTool: ~
    Sulu\McpServerBundle\Capabilities\Tool\Media\MediaUpdateTool: ~

    # Phase 04: Snippet tools
    Sulu\McpServerBundle\Capabilities\Tool\Snippet\SnippetGetTool: ~
    Sulu\McpServerBundle\Capabilities\Tool\Snippet\SnippetListTool: ~

    # Phase 04: Contact tools
    Sulu\McpServerBundle\Capabilities\Tool\Contact\ContactListTool: ~

    # Phase 04: Navigation tools
    Sulu\McpServerBundle\Capabilities\Tool\Navigation\NavigationGetTool: ~

    # Preview link tools
    Sulu\McpServerBundle\Capabilities\Tool\Preview\PreviewLinkGenerateTool: ~
    Sulu\McpServerBundle\Capabilities\Tool\Preview\PreviewLinkRevokeTool: ~  # gated by dangerous_tools.publish
