services:
    _defaults:
        autowire: true
        autoconfigure: true

    Sulu\McpServerBundle\Tool\PingTool: ~

    # MCP Resources: discovery layer for AI clients
    Sulu\McpServerBundle\Resource\TemplatesResource:
        arguments:
            $formMetadataProvider: '@sulu_admin.form_metadata_provider'
    Sulu\McpServerBundle\Resource\BlocksResource:
        arguments:
            $formMetadataProvider: '@sulu_admin.form_metadata_provider'
    Sulu\McpServerBundle\Resource\WebspacesResource: ~
# OAuth well-known controller
    Sulu\McpServerBundle\Security\OAuth\WellKnownController:
        arguments:
            $serverUrl: '%sulu_mcp_server.server_url%'
        tags: ['controller.service_arguments']

    Sulu\McpServerBundle\Security\OAuth\SuluUserResolver: ~

    # OAuth authorization
    Sulu\McpServerBundle\EventListener\OAuthAuthorizationListener: ~

    # Decorate Sulu's entry point for friendly OAuth login page
    Sulu\McpServerBundle\Security\McpAuthenticationEntryPoint:
        decorates: sulu_security.authentication_entry_point
        arguments:
            $inner: '@.inner'

    # MCP event listeners
    Sulu\McpServerBundle\EventListener\McpAuthenticationListener:
        arguments:
            $serverUrl: '%sulu_mcp_server.server_url%'
            $mcpPath: '%sulu_mcp_server.mcp_path%'

    Sulu\McpServerBundle\EventListener\McpExceptionListener:
        arguments:
            $mcpPath: '%sulu_mcp_server.mcp_path%'

    # Sets Sulu system context for MCP requests so the UserProvider can authenticate OAuth users
    Sulu\McpServerBundle\EventListener\OAuthSystemStoreListener:
        arguments:
            $mcpPath: '%sulu_mcp_server.mcp_path%'
            $defaultSystem: 'Sulu'
        tags:
            - { name: kernel.event_listener, event: kernel.request, method: onKernelRequest, priority: 64 }

    # Commands
    Sulu\McpServerBundle\Command\CreateMcpClientCommand:
        arguments:
            $serverUrl: '%sulu_mcp_server.server_url%'

    # Page read tools
    Sulu\McpServerBundle\Tool\PageGetTool: ~
    Sulu\McpServerBundle\Tool\PageListTool: ~
    Sulu\McpServerBundle\Tool\PageTreeTool: ~

    # Page write tools
    Sulu\McpServerBundle\Tool\PageCreateTool: ~
    Sulu\McpServerBundle\Tool\PageUpdateTool: ~
    Sulu\McpServerBundle\Tool\PageDeleteTool: ~

    # Block management tools
    Sulu\McpServerBundle\Tool\BlockListTool: ~
    Sulu\McpServerBundle\Tool\BlockAddTool: ~
    Sulu\McpServerBundle\Tool\BlockUpdateTool: ~
    Sulu\McpServerBundle\Tool\BlockRemoveTool: ~
    Sulu\McpServerBundle\Tool\BlockReorderTool: ~

    Sulu\Page\Domain\Repository\NavigationRepositoryInterface:
        alias: sulu_page.navigation_repository

    # Publishing tools
    Sulu\McpServerBundle\Tool\PagePublishTool: ~
    Sulu\McpServerBundle\Tool\PageUnpublishTool: ~

    # Phase 04: Article tools
    Sulu\McpServerBundle\Tool\ArticleGetTool: ~
    Sulu\McpServerBundle\Tool\ArticleListTool: ~
    Sulu\McpServerBundle\Tool\ArticleCreateTool: ~
    Sulu\McpServerBundle\Tool\ArticleUpdateTool: ~
    Sulu\McpServerBundle\Tool\ArticleDeleteTool: ~
    Sulu\McpServerBundle\Tool\ArticlePublishTool: ~
    Sulu\McpServerBundle\Tool\ArticleUnpublishTool: ~

    # Phase 04: Article block tools
    Sulu\McpServerBundle\Tool\ArticleBlockAddTool: ~
    Sulu\McpServerBundle\Tool\ArticleBlockRemoveTool: ~
    Sulu\McpServerBundle\Tool\ArticleBlockReorderTool: ~

    # Phase 04: Taxonomy tools
    Sulu\McpServerBundle\Tool\TagCreateTool: ~
    Sulu\McpServerBundle\Tool\TagListTool: ~
    Sulu\McpServerBundle\Tool\TagDeleteTool: ~
    Sulu\McpServerBundle\Tool\CategoryCreateTool: ~
    Sulu\McpServerBundle\Tool\CategoryListTool: ~
    Sulu\McpServerBundle\Tool\CategoryDeleteTool: ~

    # Phase 04: Media tools
    Sulu\McpServerBundle\Tool\MediaListTool: ~
    Sulu\McpServerBundle\Tool\MediaGetTool: ~
    Sulu\McpServerBundle\Tool\MediaUpdateTool: ~

    # Phase 04: Snippet tools
    Sulu\McpServerBundle\Tool\SnippetGetTool: ~
    Sulu\McpServerBundle\Tool\SnippetListTool: ~

    # Phase 04: Contact tools
    Sulu\McpServerBundle\Tool\ContactListTool: ~

    # Phase 04: Navigation tools
    Sulu\McpServerBundle\Tool\NavigationGetTool: ~

    # Preview link tools
    Sulu\McpServerBundle\Tool\PreviewLinkGenerateTool: ~
    Sulu\McpServerBundle\Tool\PreviewLinkRevokeTool: ~
