services:
    _defaults:
        autowire: true
        autoconfigure: true

    Sulu\McpServerBundle\Tool\PingTool: ~

    # MCP Resources: discovery layer for AI clients
    Sulu\McpServerBundle\Resource\TemplatesResource:
        arguments:
            $formMetadataProvider: '@sulu_admin.form_metadata_provider'
    Sulu\McpServerBundle\Resource\BlocksResource:
        arguments:
            $formMetadataProvider: '@sulu_admin.form_metadata_provider'
    Sulu\McpServerBundle\Resource\WebspacesResource: ~
# OAuth well-known controller
    Sulu\McpServerBundle\Security\OAuth\WellKnownController:
        arguments:
            $serverUrl: '%sulu_mcp_server.server_url%'
        tags: ['controller.service_arguments']

    Sulu\McpServerBundle\Security\OAuth\SuluUserResolver: ~

    # OAuth authorization
    Sulu\McpServerBundle\EventListener\OAuthAuthorizationListener: ~

    # Decorate Sulu's entry point for friendly OAuth login page
    Sulu\McpServerBundle\Security\McpAuthenticationEntryPoint:
        decorates: sulu_security.authentication_entry_point
        arguments:
            $inner: '@.inner'

    # MCP event listeners
    Sulu\McpServerBundle\EventListener\McpAuthenticationListener:
        arguments:
            $serverUrl: '%sulu_mcp_server.server_url%'
            $mcpPath: '%sulu_mcp_server.mcp_path%'

    Sulu\McpServerBundle\EventListener\McpExceptionListener:
        arguments:
            $mcpPath: '%sulu_mcp_server.mcp_path%'

    # Content guidelines and company context resources
    Sulu\McpServerBundle\Resource\GuidelinesResource: ~
    Sulu\McpServerBundle\Resource\CompanyContextResource: ~

    # Content guidelines and company context write tools
    Sulu\McpServerBundle\Tool\UpdateGuidelinesTool: ~
    Sulu\McpServerBundle\Tool\UpdateCompanyContextTool: ~
    Sulu\McpServerBundle\Tool\GetContextTool: ~

    # Repositories for guidelines and company context
    Sulu\McpServerBundle\Repository\ContentGuidelinesRepository: ~
    Sulu\McpServerBundle\Repository\CompanyContextRepository: ~
    Sulu\McpServerBundle\Repository\ContentGuidelinesRepositoryInterface:
        alias: Sulu\McpServerBundle\Repository\ContentGuidelinesRepository
    Sulu\McpServerBundle\Repository\CompanyContextRepositoryInterface:
        alias: Sulu\McpServerBundle\Repository\CompanyContextRepository

    # Commands
    Sulu\McpServerBundle\Command\CreateMcpClientCommand:
        arguments:
            $serverUrl: '%sulu_mcp_server.server_url%'

    Sulu\Page\Domain\Repository\NavigationRepositoryInterface:
        alias: sulu_page.navigation_repository
