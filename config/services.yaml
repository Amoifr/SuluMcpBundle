services:
    _defaults:
        autowire: true
        autoconfigure: true

    _instanceof:
        Sulu\McpServerBundle\AdminLink\AdminLinkProviderInterface:
            tags: ['sulu_mcp_server.admin_link_provider']

    # Admin deeplink registry. Providers need sulu_admin.view_registry, which
    # only exists in the admin container, so they carry the sulu.context: admin
    # tag to be dropped from the website/preview container. The generator is
    # context-agnostic and just gets an empty iterator there.
    Sulu\McpServerBundle\AdminLink\AdminLinkGenerator:
        arguments:
            $providers: !tagged_iterator sulu_mcp_server.admin_link_provider
    Sulu\McpServerBundle\AdminLink\AdminLinkGeneratorInterface: '@Sulu\McpServerBundle\AdminLink\AdminLinkGenerator'

    Sulu\McpServerBundle\AdminLink\Provider\PageAdminLinkProvider:
        arguments:
            $viewRegistry: '@sulu_admin.view_registry'
        tags:
            - { name: sulu.context, context: admin }
    Sulu\McpServerBundle\AdminLink\Provider\ArticleAdminLinkProvider:
        arguments:
            $viewRegistry: '@sulu_admin.view_registry'
        tags:
            - { name: sulu.context, context: admin }
    Sulu\McpServerBundle\AdminLink\Provider\SnippetAdminLinkProvider:
        arguments:
            $viewRegistry: '@sulu_admin.view_registry'
        tags:
            - { name: sulu.context, context: admin }
    Sulu\McpServerBundle\AdminLink\Provider\MediaAdminLinkProvider:
        arguments:
            $viewRegistry: '@sulu_admin.view_registry'
        tags:
            - { name: sulu.context, context: admin }
    Sulu\McpServerBundle\AdminLink\Provider\TagAdminLinkProvider:
        arguments:
            $viewRegistry: '@sulu_admin.view_registry'
        tags:
            - { name: sulu.context, context: admin }
    Sulu\McpServerBundle\AdminLink\Provider\CategoryAdminLinkProvider:
        arguments:
            $viewRegistry: '@sulu_admin.view_registry'
        tags:
            - { name: sulu.context, context: admin }

    # Decorates mcp.registry to drop tools disabled via `dangerous_tools.*`.
    # Attribute discovery would otherwise re-add them after DangerousToolsPass
    # removed the services, and calls would fall through to `new $class()`.
    Sulu\McpServerBundle\Capability\FilteredRegistry:
        decorates: mcp.registry
        arguments:
            $inner: '@.inner'
            $visibilityResolver: '@Sulu\McpServerBundle\Security\Permission\ToolVisibilityResolver'
            $disabledToolNames: '%sulu_mcp_server.disabled_tool_names%'

    Sulu\McpServerBundle\Security\Permission\ToolPermissionChecker: ~
    Sulu\McpServerBundle\Security\Permission\ToolPermissionCheckerInterface: '@Sulu\McpServerBundle\Security\Permission\ToolPermissionChecker'
    Sulu\McpServerBundle\Security\Permission\WebspacePermissionResolver: ~

    Sulu\McpServerBundle\Security\Permission\AccessControlFilterFactory:
        arguments:
            $security: '@security.helper'
            $permissions: '%sulu_security.permissions%'

    # Discovery-layer filtering for tools/list; $contextResolvers is keyed the same
    # way as PermissionAwareCallToolHandler's.
    Sulu\McpServerBundle\Security\Permission\ToolVisibilityResolver:
        arguments:
            $permissionMap: '%sulu_mcp_server.tool_permissions%'
            $contextResolvers:
                sulu_mcp_server.contact_context_resolver: '@sulu_mcp_server.contact_context_resolver'
                sulu_mcp_server.article_context_resolver: '@sulu_mcp_server.article_context_resolver'
            $allowlist: ['sulu_ping', 'sulu_get_context']

    # Reproduces PageDescendantSecurityListener (spec F10) for the MCP delete tool,
    # which dispatches RemovePageMessage directly and bypasses that route listener.
    Sulu\McpServerBundle\Security\Permission\PageDescendantPermissionChecker:
        arguments:
            $pageRepository: '@sulu_page.page_repository'
            $accessControlRepository: '@sulu.repository.access_control'
            $systemStore: '@sulu_security.system_store'
            $security: '@security.helper'
            $permissions: '%sulu_security.permissions%'

    sulu_mcp_server.contact_context_resolver:
        class: Sulu\McpServerBundle\Security\Permission\ContactSecurityContextResolver

    sulu_mcp_server.article_context_resolver:
        class: Sulu\McpServerBundle\Security\Permission\ArticleSecurityContextResolver
        arguments:
            $groupProvider: '@sulu_admin.metadata_group_provider'
    Sulu\McpServerBundle\Security\Permission\ArticleSecurityContextResolver: '@sulu_mcp_server.article_context_resolver'
    Sulu\McpServerBundle\Security\Permission\ContentSecurityContextResolver: ~

    # Central fail-closed permission gate: preflight-checks the compile-time
    # permission map before delegating to the SDK's built-in CallToolHandler.
    Sulu\McpServerBundle\Capability\PermissionAwareCallToolHandler:
        arguments:
            $registry: '@mcp.registry'
            $referenceHandler: '@sulu_mcp_server.reference_handler'
            $webspacePermissionResolver: '@Sulu\McpServerBundle\Security\Permission\WebspacePermissionResolver'
            $permissionMap: '%sulu_mcp_server.tool_permissions%'
            $contextResolvers:
                sulu_mcp_server.contact_context_resolver: '@sulu_mcp_server.contact_context_resolver'
                sulu_mcp_server.article_context_resolver: '@sulu_mcp_server.article_context_resolver'
            $allowlist: ['sulu_ping', 'sulu_get_context']
        tags:
            - { name: mcp.request_handler, priority: 100 }

    Sulu\McpServerBundle\Capabilities\Tool\PingTool: ~
    Sulu\McpServerBundle\Capabilities\Tool\GetContextTool: ~
    Sulu\McpServerBundle\Capabilities\Tool\ContentSearchTool:
        arguments:
            $engine: '@cmsig_seal.engine.default'

    # MCP Resources: discovery layer for AI clients
    Sulu\McpServerBundle\Capabilities\Resource\FieldValueExampleProvider: ~
    Sulu\McpServerBundle\Capabilities\Resource\TemplatesResource:
        arguments:
            $formMetadataProvider: '@sulu_admin.form_metadata_provider'
    Sulu\McpServerBundle\Capabilities\Resource\BlocksResource:
        arguments:
            $formMetadataProvider: '@sulu_admin.form_metadata_provider'
    Sulu\McpServerBundle\Capabilities\Resource\WebspacesResource: ~
    Sulu\McpServerBundle\Capabilities\Resource\ExtensionFieldsResource:
        arguments:
            $formMetadataProvider: '@sulu_admin.form_metadata_provider'
# OAuth well-known controller
    Sulu\McpServerBundle\Security\OAuth\WellKnownController:
        arguments:
            $serverUrl: '%sulu_mcp_server.server_url%'
            $mcpPath: '%sulu_mcp_server.mcp_path%'
            $scopes: '%sulu_mcp_server.oauth.scopes%'
        tags: ['controller.service_arguments']

    Sulu\McpServerBundle\Security\OAuth\DynamicClientRegistrationController:
        arguments:
            $serverUrl: '%sulu_mcp_server.server_url%'
            $allowedScopes: '%sulu_mcp_server.oauth.scopes%'
        tags: ['controller.service_arguments']

    Sulu\McpServerBundle\Security\OAuth\OAuthConsentStore: ~

    Sulu\McpServerBundle\Security\OAuth\OAuthConsentController:
        tags: ['controller.service_arguments']

    Sulu\McpServerBundle\Security\OAuth\SuluUserResolver: ~

    Sulu\McpServerBundle\Admin\OAuthConsentAdmin:
        tags:
            - { name: sulu.context, context: admin }

    # OAuth authorization
    Sulu\McpServerBundle\Security\EventListener\OAuthAuthorizationListener: ~

    # Redirect unauthenticated OAuth-authorize hits to the Sulu admin login
    Sulu\McpServerBundle\Security\McpAuthenticationEntryPoint:
        decorates: sulu_security.authentication_entry_point
        arguments:
            $inner: '@.inner'

    # After admin login, resume a pending /admin/mcp/authorize OAuth request.
    Sulu\McpServerBundle\Security\EventListener\McpLoginSuccessListener: ~

    # MCP event listeners
    Sulu\McpServerBundle\Security\EventListener\McpAuthenticationListener:
        arguments:
            $serverUrl: '%sulu_mcp_server.server_url%'
            $mcpPath: '%sulu_mcp_server.mcp_path%'

    Sulu\McpServerBundle\Security\EventListener\McpExceptionListener:
        arguments:
            $mcpPath: '%sulu_mcp_server.mcp_path%'

    # Forces request format to "json" for MCP requests so Sulu's MarkupBundle
    # response listener does not run the HtmlMarkupParser on JSON-RPC responses
    Sulu\McpServerBundle\Security\EventListener\McpRequestFormatListener:
        arguments:
            $mcpPath: '%sulu_mcp_server.mcp_path%'
        tags:
            - { name: kernel.event_listener, event: kernel.request, method: onKernelRequest, priority: 64 }

    # Sets Sulu system context for MCP requests so the UserProvider can authenticate OAuth users
    Sulu\McpServerBundle\Security\EventListener\OAuthSystemStoreListener:
        arguments:
            $mcpPath: '%sulu_mcp_server.mcp_path%'
            $defaultSystem: 'Sulu'
        tags:
            - { name: kernel.event_listener, event: kernel.request, method: onKernelRequest, priority: 64 }

    # Commands
    Sulu\McpServerBundle\Command\CreateMcpClientCommand:
        arguments:
            $serverUrl: '%sulu_mcp_server.server_url%'
            $mcpPath: '%sulu_mcp_server.mcp_path%'

    # Page read tools
    Sulu\McpServerBundle\Capabilities\Tool\Page\PageGetTool: ~
    Sulu\McpServerBundle\Capabilities\Tool\Page\PageListTool: ~
    Sulu\McpServerBundle\Capabilities\Tool\Page\PageTreeTool: ~

    # Page write tools
    Sulu\McpServerBundle\Capabilities\Tool\Page\PageCreateTool: ~
    Sulu\McpServerBundle\Capabilities\Tool\Page\PageUpdateTool: ~

    # Unified content tools (page | article | snippet via `type`)
    Sulu\McpServerBundle\Capabilities\Tool\Content\ContentDeleteTool: ~  # gated by dangerous_tools.delete
    Sulu\McpServerBundle\Capabilities\Tool\Content\ContentPublishTool: ~  # gated by dangerous_tools.publish
    Sulu\McpServerBundle\Capabilities\Tool\Content\ContentUnpublishTool: ~  # gated by dangerous_tools.publish

    # Block management tools
    Sulu\McpServerBundle\Capabilities\Tool\ContentTypeResolver: ~
    Sulu\McpServerBundle\Capabilities\Tool\ContentMetadataMapper:
        arguments:
            $formMetadataProvider: '@sulu_admin.form_metadata_provider'
    Sulu\McpServerBundle\Capabilities\Tool\Block\BlockDataValidator:
        arguments:
            $formMetadataProvider: '@sulu_admin.form_metadata_provider'
    Sulu\McpServerBundle\Capabilities\Tool\Page\BlockListTool: ~
    Sulu\McpServerBundle\Capabilities\Tool\Page\BlockAddTool: ~
    Sulu\McpServerBundle\Capabilities\Tool\Page\BlockUpdateTool: ~
    Sulu\McpServerBundle\Capabilities\Tool\Page\BlockRemoveTool: ~  # gated by dangerous_tools.block_remove
    Sulu\McpServerBundle\Capabilities\Tool\Page\BlockReorderTool: ~

    Sulu\Page\Domain\Repository\NavigationRepositoryInterface:
        alias: sulu_page.navigation_repository

    Sulu\Bundle\PreviewBundle\Application\Manager\PreviewLinkManagerInterface:
        alias: sulu_preview.preview_link_manager

    # Phase 04: Article tools
    Sulu\McpServerBundle\Capabilities\Tool\Article\ArticleGroupResolver:
        arguments:
            $groupProvider: '@sulu_admin.metadata_group_provider'
    Sulu\McpServerBundle\Capabilities\Tool\Article\ArticleGetTool: ~
    Sulu\McpServerBundle\Capabilities\Tool\Article\ArticleListTool: ~
    Sulu\McpServerBundle\Capabilities\Tool\Article\ArticleCreateTool: ~
    Sulu\McpServerBundle\Capabilities\Tool\Article\ArticleUpdateTool: ~

    # Phase 04: Taxonomy tools
    Sulu\McpServerBundle\Capabilities\Tool\Taxonomy\TagCreateTool: ~
    Sulu\McpServerBundle\Capabilities\Tool\Taxonomy\TagListTool: ~
    Sulu\McpServerBundle\Capabilities\Tool\Taxonomy\TagDeleteTool: ~  # gated by dangerous_tools.delete
    Sulu\McpServerBundle\Capabilities\Tool\Taxonomy\CategoryCreateTool: ~
    Sulu\McpServerBundle\Capabilities\Tool\Taxonomy\CategoryListTool: ~
    Sulu\McpServerBundle\Capabilities\Tool\Taxonomy\CategoryDeleteTool: ~  # gated by dangerous_tools.delete

    # Phase 04: Media tools
    Sulu\McpServerBundle\Capabilities\Tool\Media\MediaListTool: ~
    Sulu\McpServerBundle\Capabilities\Tool\Media\MediaGetTool: ~
    Sulu\McpServerBundle\Capabilities\Tool\Media\MediaUpdateTool: ~

    # Phase 04: Snippet tools
    Sulu\McpServerBundle\Capabilities\Tool\Snippet\SnippetGetTool: ~
    Sulu\McpServerBundle\Capabilities\Tool\Snippet\SnippetListTool: ~
    Sulu\McpServerBundle\Capabilities\Tool\Snippet\SnippetCreateTool: ~
    Sulu\McpServerBundle\Capabilities\Tool\Snippet\SnippetUpdateTool: ~

    # Phase 04: Contact tools
    Sulu\McpServerBundle\Capabilities\Tool\Contact\ContactListTool: ~

    # Phase 04: Navigation tools
    Sulu\McpServerBundle\Capabilities\Tool\Navigation\NavigationGetTool: ~

    # Preview link tools
    Sulu\McpServerBundle\Capabilities\Tool\Preview\PreviewLinkGenerateTool: ~
    Sulu\McpServerBundle\Capabilities\Tool\Preview\PreviewLinkRevokeTool: ~  # gated by dangerous_tools.publish
